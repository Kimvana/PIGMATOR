
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PIGMATOR</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.6.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.6.1/core.js">
    </script>

    <script src="./js/theme.js" defer></script>

</head>

<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

        <symbol id="icon-light" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2 M12 20v2 M4.93 4.93l1.42 1.42
                    M17.65 17.65l1.42 1.42 M2 12h2 M20 12h2
                    M4.93 19.07l1.42-1.42
                    M17.65 6.35l1.42-1.42"/>
        </symbol>

        <symbol id="icon-dark" viewBox="0 0 24 24">
            <path d="M20.5 15.5A9 9 0 0 1 8.5 3.5
                    A9 9 0 1 0 20.5 15.5Z"/>
        </symbol>

        <symbol id="icon-system" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="13" rx="2"/>
            <path d="M8 21h8 M12 17v4"/>
        </symbol>

    </svg>

    <header class="page-header">
        <div class="header-title">
            <h1>PIGMATOR</h1>
            <p>Interactive colour palette analysis</p>
        </div>

        <div class="theme-selector">

            <button
                id="theme-menu-button"
                type="button"
                aria-label="Colour theme"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="theme-menu"
            >
                <!-- Sun icon -->
                <svg class="theme-icon icon-light" hidden>
                    <use href="#icon-light"/>
                </svg>

                <svg class="theme-icon icon-dark" hidden>
                    <use href="#icon-dark"/>
                </svg>

                <svg class="theme-icon icon-system" hidden>
                    <use href="#icon-system"/>
                </svg>

                <span class="dropdown-arrow">▾</span>
            </button>

            <div id="theme-menu" class="theme-menu" hidden>

                <button type="button" data-theme="light">
                    <svg class="theme-icon">
                        <use href="#icon-light"/>
                    </svg>
                    Light
                </button>

                <button type="button" data-theme="dark">
                    <svg class="theme-icon">
                        <use href="#icon-dark"/>
                    </svg>
                    Dark
                </button>

                <button type="button" data-theme="system">
                    <svg class="theme-icon">
                        <use href="#icon-system"/>
                    </svg>
                    System
                </button>

            </div>

        </div>
    </header>

    <main class="dashboard">

        <!-- LEFT: Colour waypoints -->
        <section class="panel waypoint-panel">

            <h2>Colour waypoints</h2>

            <button
                type="button"
                class="add-waypoint add-waypoint-top"
                id="add-waypoint-top"
            >
                + Add waypoint
            </button>

            <div id="waypoint-list"></div>

            <button
                type="button"
                class="add-waypoint add-waypoint-bottom"
                id="add-waypoint-bottom"
            >
                + Add waypoint
            </button>

        </section>


        <!-- MIDDLE: Colour space visualisation -->
        <section class="panel graph-panel">

            <h2>Colour space</h2>

            <div class="placeholder">
                <p>Colour space visualisation</p>
                <p>Coming later</p>
            </div>

        </section>


        <!-- RIGHT: Palette preview -->
        <section class="panel palette-panel">

            <div id="palette-representations">

                <div class="palette-column-header">

                    <h2>Palette preview</h2>

                    <select id="interpolation-method"
                            aria-label="Interpolation method">

                        <option value="srgb" selected>sRGB</option>
                        <option value="linrgb">linear RGB</option>
                        <option value="hsv">HSV</option>
                        <option value="hsl">HSL</option>
                        <option value="oklab">OKLab</option>

                    </select>

                </div>

                <div class="palette-representation"
                    data-representation="normal">

                    <div class="palette-representation-header">

                        <h2>Full colors</h2>

                    </div>

                    <div class="palette-bar-container">

                        <div class="palette-gradient"
                            id="palette-gradient">
                        </div>

                        <div class="palette-waypoint-markers"
                            id="palette-waypoint-markers">
                        </div>

                        <div class="palette-waypoint-swatches"
                            id="palette-waypoint-swatches">
                        </div>

                    </div>

                </div>

                <div class="palette-representation"
                    data-representation="grayscale">

                    <div class="palette-representation-header">
                        <h2>Grayscale</h2>
                    </div>

                    <div class="palette-bar-container">
                        <div class="palette-gradient"
                            id="grayscale-gradient">
                        </div>

                        <div class="palette-waypoint-markers"
                            id="grayscale-waypoint-markers">
                        </div>

                        <div class="palette-waypoint-swatches"
                            id="grayscale-waypoint-swatches">
                        </div>
                    </div>

                </div>
    
                <div class="palette-representation"
                    data-representation="protanopia">

                    <div class="palette-representation-header">
                        <h2>Protanopia Simulation</h2>
                    </div>

                    <div class="palette-bar-container">
                        <div class="palette-gradient"
                            id="protanopia-gradient">
                        </div>

                        <div class="palette-waypoint-markers"
                            id="protanopia-waypoint-markers">
                        </div>

                        <div class="palette-waypoint-swatches"
                            id="protanopia-waypoint-swatches">
                        </div>
                    </div>

                </div>

            </div>

        </section>

    </main>

    <script type="py"
            src="./python/main.py"
            config="./conf.json">
    </script>

</body>
</html>
